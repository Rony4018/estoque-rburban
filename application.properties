# Configuração da Base de Dados (exemplo para PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/estoque_rburban
spring.datasource.username=postgres
spring.datasource.password=sua_senha_aqui

# Configuração do Hibernate / JPA para criar as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Porta do servidor da aplicação
server.port=8080
